version: '3.8'

services:
  lenr-api:
    build: .
    container_name: lenr-collection-api
    ports:
      - "8000:8000"
    environment:
      - EXCEL_PATH=/data/lenr_papers.xlsx
      - PDF_DIR=/data/pdfs
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MAX_PAPERS_PER_RUN=50
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  data:
